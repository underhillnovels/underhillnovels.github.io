<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Underhill Novels</title>
  <meta name="description" content="Fiction by Sharyn Underhill.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f6f1e7; --ink: #2b2622; --muted: #7a6f64; --rule: #d9cfbf; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #1c1a17; --ink: #ece4d6; --muted: #a39887; --rule: #3a352e; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--paper); color: var(--ink);
      font-family: "EB Garamond", Georgia, serif; font-size: 1.25rem; line-height: 1.6;
      padding: 2rem 1rem;
    }
    main { max-width: 32rem; text-align: center; }
    h1 { font-weight: 500; font-size: clamp(2.2rem, 7vw, 3.4rem); letter-spacing: .02em; margin: 0; }
    hr { width: 4rem; border: 0; border-top: 1px solid var(--rule); margin: 1.5rem auto; }
    p { margin: 0; color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <main>
    <h1>Sharyn Underhill</h1>
    <hr>
    <p>Stories are on their way.</p>
  </main>
</body>
</html>
